<script>
'use strict';
const GAME_VERSION="0.14.0-test";
let faultVisible=false;
function displayRuntimeFault(message){if(faultVisible)return;faultVisible=true;try{state='error';keys={};resetPad();show('<h1>ゲームを一時停止しました</h1><p>エラーが発生しました。下の内容をお知らせください。</p><p id="runtimeError" class="error-detail"></p><button id="faultHome">タイトルへ戻る</button>');$('runtimeError').textContent='v'+GAME_VERSION+' / '+String(message).slice(0,400);$('faultHome').onclick=()=>{faultVisible=false;resize();menu();scheduleFrame()}}catch{}}
addEventListener('error',event=>displayRuntimeFault(event.message||'実行エラー'));
addEventListener('unhandledrejection',event=>displayRuntimeFault(event.reason?.message||String(event.reason)));

function pressureCrowd(){let bins=Array(8).fill(0),near=0;for(const e of enemies){if(e.dead||e.escaped||e.age<.7||e.retreat)continue;let d=Math.hypot(e.x-p.x,e.y-p.y);if(d<240){near++;bins[Math.floor((Math.atan2(e.y-p.y,e.x-p.x)+Math.PI)/(Math.PI*2)*8)%8]++}}let blocked=bins.filter(n=>n>=2).length;return {near,blocked,pressure:Math.min(1,near/32*.55+blocked/8*.45)}}

let strain=0,pressureStats={},soothers=[],leafDrops=0,hordeWarning=null;
let circlePickupFx=[];
function collectCircle(){if(!beacon||beacon.used||Math.hypot(p.x-beacon.x,p.y-beacon.y)>=beacon.r+32)return false;beacon.used=true;p.circleUntil=t+5;p.pressureGraceUntil=t+5;pressureStats.circlePickups++;p.circleLessonPending=true;circlePickupFx.push({x:beacon.x,y:beacon.y,age:0,life:.72});circlePickupFx=circlePickupFx.slice(-3);tone(880,.09,.045,'sine');tone(1320,.14,.035,'sine');return true}
function drawCirclePickupFx(){if(!['play','settling'].includes(state))return;g.save();for(const f of circlePickupFx){let k=Math.min(1,f.age/f.life);g.globalAlpha=(1-k)*.9;g.strokeStyle='#f1dcff';g.fillStyle='#e5c6ff';g.lineWidth=3;if(!reduced){g.beginPath();g.arc(f.x,f.y,62*(1-k),0,Math.PI*2);g.stroke();for(let i=0;i<8;i++){let a=i*Math.PI/4,ox=f.x+Math.cos(a)*54,oy=f.y+Math.sin(a)*54,u=1-Math.pow(1-k,3),x=ox+(p.x-ox)*u,y=oy+(p.y-oy)*u;g.beginPath();g.moveTo(x-(p.x-ox)*.07*(1-k),y-(p.y-oy)*.07*(1-k));g.lineTo(x,y);g.stroke();g.beginPath();g.arc(x,y,3,0,Math.PI*2);g.fill()}}g.beginPath();g.arc(p.x,p.y,reduced?40:30+16*k,0,Math.PI*2);g.stroke();g.font='bold 13px system-ui';g.textAlign='center';g.strokeStyle='#18243e';g.lineWidth=4;g.fillStyle='#f3e7ff';let x=Math.max(28,Math.min(W-28,p.x)),y=Math.max(94,p.y-65);g.strokeText('強化！',x,y);g.fillText('強化！',x,y)}g.restore()}
function beginReleaseMotion(mode,value){p.releaseMotion={mode,value,age:0,life:mode==='normal'?.38:mode==='vent'?1.4:.90};if(mode==='clutch'){tone(660,.12,.045,'triangle');tone(990,.18,.035,'sine')}else if(mode==='vent'){tone(220,.18,.05,'sine');tone(110,.25,.035,'sine')}}
function releasePose(){const m=p.releaseMotion;if(!m||reduced)return {sx:1,sy:1,rotation:0,dy:0,defensive:m?.mode==='vent'};let a=m.age;if(m.mode==='vent'){let settle=Math.max(0,1-a/.75);return {sx:1+.34*settle,sy:1-.30*settle,rotation:Math.sin(a*11)*.16*settle,dy:6*settle,defensive:true}}if(m.mode==='clutch'){if(a<.075)return {sx:1.18,sy:.72,rotation:0,dy:4,defensive:false};let kick=Math.max(0,1-(a-.075)/.33);return {sx:1+.17*kick,sy:1+.23*kick,rotation:0,dy:-7*kick,defensive:false}}return {sx:1,sy:1,rotation:0,dy:0,defensive:false}}
function drawReleaseMotion(){const m=p.releaseMotion;if(!m||!['play','settling'].includes(state)||m.mode==='normal')return;let k=Math.min(1,m.age/m.life),fade=Math.min(1,(1-k)*3);g.save();g.globalAlpha=fade;g.translate(p.x,p.y);if(m.mode==='vent'){
 // Open puffs and broken arcs, rather than the closed blast of a manual attack.
 g.strokeStyle='#b9cbd9';g.lineWidth=3;let reach=reduced?67:37+105*(1-Math.pow(1-k,2));
 for(let i=0;i<6;i++){let a=i*Math.PI/3;g.save();g.rotate(a);g.beginPath();g.moveTo(reach-20,-5);g.quadraticCurveTo(reach-4,-21,reach+11,-7);g.quadraticCurveTo(reach+23,3,reach+5,11);g.stroke();g.beginPath();g.moveTo(reach+12,-13);g.lineTo(reach+23,-8);g.stroke();g.restore()}
 g.strokeStyle='#dce5eb';g.setLineDash([9,14]);g.lineWidth=2;g.beginPath();g.arc(0,0,reduced?49:39+32*k,0,Math.PI*2);g.stroke();g.setLineDash([]);
 g.globalAlpha=fade;g.font='bold 12px system-ui';g.textAlign='center';g.strokeStyle='#152337';g.lineWidth=4;let x=Math.max(85,Math.min(W-85,p.x))-p.x,y=(p.y<155?p.y+65:p.y-64)-p.y;g.strokeText('モヤが逃げた',x,y);g.fillStyle='#e0e9ef';g.fillText('モヤが逃げた',x,y);g.font='bold 11px system-ui';g.strokeText('得点なし',x,y+17);g.fillText('得点なし',x,y+17);
 }else{
 let launch=Math.max(0,Math.min(1,(k-.08)/.65)),r=reduced?64:32+150*(1-Math.pow(1-launch,3));g.strokeStyle='#ffe4a1';g.lineWidth=5;g.beginPath();g.arc(0,0,r,0,Math.PI*2);g.stroke();g.lineWidth=2;g.beginPath();g.arc(0,0,Math.max(8,r-14),0,Math.PI*2);g.stroke();g.fillStyle='#fff0b3';let n=reduced?4:lightFx?8:12;for(let i=0;i<n;i++){let a=i/n*Math.PI*2;g.save();g.rotate(a);g.beginPath();g.moveTo(r*.65,0);g.lineTo(r+17,-3);g.lineTo(r+28,0);g.lineTo(r+17,3);g.closePath();g.fill();g.restore()}
 }g.restore()}
function circleActive(){return (p.circleUntil||0)>t||!!(beacon&&!beacon.used&&Math.hypot(p.x-beacon.x,p.y-beacon.y)<beacon.r+32)}
function addBurstBonus(b,value){if(!value)return;score+=value;b.score=(b.score||0)+value;b.baseScore=(b.baseScore||0)+value;updateComboBonus(b)}
function pressureHit(){strain=Math.min(100,strain+(t<(p.pressureGraceUntil||0)?9:18));pressureStats.contacts++}
function pressureTick(dt){
 collectCircle();
 if(p.circleUntil&&t>=p.circleUntil){p.circleUntil=0;pressureStats.circleExpired++}
 let reachedLimit=strain>=100,c=pressureCrowd();strain=Math.max(0,Math.min(100,strain+dt*(c.near<3?-12:c.pressure*14*(t<(p.pressureGraceUntil||0)?.5:1))));
 pressureStats.integral+=strain*dt;if(strain>=80)pressureStats.highSeconds+=dt;pressureStats.peak=Math.max(pressureStats.peak,reachedLimit?100:strain);
 if(reachedLimit||strain>=100){pressureStats.emergencies++;p.ventUntil=t+1.8;strain=35;inv=Math.max(inv,1.5);for(const e of enemies){let dx=e.x-p.x,dy=e.y-p.y,d=Math.hypot(dx,dy)||1;if(!e.dead&&!e.escaped&&d<165){e.x=p.x+dx/d*180;e.y=p.y+dy/d*180;e.escaped=true;e.launch=null;e.retreat=1.4;e.retreatX=dx/d;e.retreatY=dy/d}}p.escapeLessonPending=true;beginReleaseMotion('vent',100)}
 for(const s of soothers){if(Math.hypot(s.x-p.x,s.y-p.y)<30){s.until=0;strain=Math.max(0,strain-8);pressureStats.pickups++;ring(p.x,p.y,45,'#bdffcb')}}soothers=soothers.filter(s=>s.until>t);
}
function pressurePaint(){if(!['play','settling','end'].includes(state))return;g.save();
 if(hordeWarning&&state==='play'){g.strokeStyle='#ffce8a';g.lineWidth=2;g.setLineDash([5,7]);g.beginPath();g.arc(hordeWarning.x,hordeWarning.y,65,0,7);g.stroke();g.setLineDash([]);g.font='bold 13px system-ui';g.textAlign='center';g.fillStyle='#ffdfab';g.fillText('大群が来る',hordeWarning.x,hordeWarning.y-75)}
 for(const s of soothers){g.fillStyle='#b5ffc2';g.beginPath();g.arc(s.x,s.y,8,0,7);g.fill()}
 if(p.circleUntil>t){g.strokeStyle='#c9adff';g.lineWidth=3;g.beginPath();g.arc(p.x,p.y,43,-Math.PI/2,-Math.PI/2+Math.PI*2*(p.circleUntil-t)/5);g.stroke()}
 if(strain>=40){g.strokeStyle=strain>=80?'#ffbd9f':'#ffe2ac';g.globalAlpha=.85;g.lineWidth=3;let x=43-(strain/100)*6;for(const side of [-1,1]){g.beginPath();g.moveTo(p.x+side*(x+6),p.y-13);g.lineTo(p.x+side*x,p.y-7);g.lineTo(p.x+side*x,p.y+7);g.lineTo(p.x+side*(x+6),p.y+13);g.stroke()}if(strain>=80&&!p.releaseMotion){g.globalAlpha=1;g.font='bold 12px system-ui';g.textAlign='center';g.fillStyle='#ffe1bf';g.strokeStyle='#152337';g.lineWidth=4;let text=charge>=100?'光を放つ！':'離れよう',x=Math.max(86,Math.min(W-86,p.x)),y=p.y+79;g.strokeText(text,x,y);g.fillText(text,x,y)}}
