function initAudio(){if(!audioOn)return;try{ac??=new AudioContext();if(ac.state==='suspended'||ac.state==='interrupted')ac.resume().catch(()=>{});if(master)return;master=ac.createGain();master.gain.value=.48;let limiter=ac.createDynamicsCompressor();limiter.threshold.value=-12;limiter.ratio.value=8;master.connect(limiter);limiter.connect(ac.destination);bgmBus=ac.createGain();bgmBus.gain.value=0;bgmBus.connect(master);sfxBus=ac.createGain();sfxBus.gain.value=sfxVolume;sfxBus.connect(master);ambience=ac.createGain();ambience.gain.value=0;ambFilter=ac.createBiquadFilter();ambFilter.type='lowpass';ambFilter.frequency.value=220;let o=ac.createOscillator();o.type='sawtooth';o.frequency.value=52;o.connect(ambFilter);ambFilter.connect(ambience);ambience.connect(sfxBus||master);o.start();noiseBuffer=ac.createBuffer(1,ac.sampleRate*.5,ac.sampleRate);let data=noiseBuffer.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=Math.random()*2-1;}catch{}}
